<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STK Push Test</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:400px;margin:40px auto;padding:0 16px;}
  h1{font-size:20px;}
  label{display:block;margin:12px 0 4px;font-size:13px;color:#555;}
  input{width:100%;padding:10px;font-size:15px;box-sizing:border-box;border:1px solid #ccc;border-radius:6px;}
  button{width:100%;margin-top:16px;padding:12px;font-size:15px;background:#0d5f2f;color:#fff;border:none;border-radius:6px;cursor:pointer;}
  button:disabled{background:#999;}
  #status{margin-top:16px;font-size:14px;padding:10px;border-radius:6px;display:none;}
  #status.pending{display:block;background:#fff8e1;color:#a67c00;}
  #status.ok{display:block;background:#e8f5e9;color:#0d5f2f;}
  #status.err{display:block;background:#fdecea;color:#c62828;}
</style>
</head>
<body>
  <h1>STK Push Test</h1>
  <form id="f">
    <label>Phone (2547XXXXXXXX)</label>
    <input id="phone" required placeholder="254712345678">
    <label>Amount (KES)</label>
    <input id="amount" type="number" required placeholder="10">
    <label>Reference</label>
    <input id="reference" required placeholder="TEST-1">
    <button id="btn" type="submit">Send STK Push</button>
  </form>
  <div id="status"></div>

<script>
const form = document.getElementById('f');
const btn = document.getElementById('btn');
const status = document.getElementById('status');
let poll;

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearInterval(poll);
  btn.disabled = true;
  status.className = 'pending';
  status.textContent = 'Sending...';

  const phone = document.getElementById('phone').value.trim();
  const amount = Number(document.getElementById('amount').value);
  const reference = document.getElementById('reference').value.trim();

  try {
    const res = await fetch('/api/stk-push', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone, amount, reference })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');

    status.textContent = 'Sent. Waiting for customer to approve on phone...';
    if (data.transactionId) pollStatus(data.transactionId);
  } catch (err) {
    status.className = 'err';
    status.textContent = err.message;
  } finally {
    btn.disabled = false;
  }
});

function pollStatus(id){
  let n = 0;
  poll = setInterval(async () => {
    n++;
    if (n > 20) { clearInterval(poll); return; }
    const res = await fetch('/api/status?id=' + encodeURIComponent(id));
    const data = await res.json();
    if (data.status === 'COMPLETED') {
      clearInterval(poll);
      status.className = 'ok';
      status.textContent = 'Completed. Receipt: ' + (data.metadata?.mpesaReceipt || '—');
    } else if (data.status === 'FAILED' || data.status === 'CANCELLED') {
      clearInterval(poll);
      status.className = 'err';
      status.textContent = 'Payment ' + data.status.toLowerCase();
    }
  }, 3000);
}
</script>
</body>
</html>
